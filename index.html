<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Calendly: warm up DNS/TLS so the Contact page widget loads faster -->
    <link rel="dns-prefetch" href="https://assets.calendly.com" />
    <link rel="dns-prefetch" href="https://calendly.com" />
    <link rel="preconnect" href="https://assets.calendly.com" crossorigin />
    <link rel="preconnect" href="https://calendly.com" crossorigin />
    <!-- Calendly: start fetching the widget assets in parallel with the app bundle
         so the Contact page scheduler is ready the moment the route mounts. -->
    <link rel="preload" as="script" href="https://assets.calendly.com/assets/external/widget.js" />
    <link rel="preload" as="style" href="https://assets.calendly.com/assets/external/widget.css" />
    <script src="https://assets.calendly.com/assets/external/widget.js" defer></script>
    <!-- Hero background image: preload for faster LCP -->
    <link rel="preload" as="image" href="/hero-bg.jpg" fetchpriority="high" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap"
      />
    </noscript>
    <meta name="author" content="Jonathan Shore" />
    <meta name="google-site-verification" content="8HlaLqtomWG2imzEU-OvRlxJTEWqLZOrZC_PMq6NzxE" />

    <!-- Static Open Graph fallback for non-JS crawlers (LinkedIn, Slack, etc.).
         react-helmet-async replaces these per-route for JS-executing crawlers. -->
    <meta property="og:title" content="Jonathan Shore — Partner Ecosystem Strategist" />
    <meta property="og:description" content="Jonathan Shore helps B2B tech companies build, fix, and scale partner ecosystems that drive measurable revenue. 15+ years experience." />
    <meta property="og:url" content="https://shore-strategy.lovable.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shore Strategy" />
    <meta property="og:image" content="https://shore-strategy.lovable.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="keywords" content="partner ecosystem strategy, fractional partnerships leader, channel partner strategy, partner program consultant, go-to-market consultant, B2B SaaS partnerships, partner ecosystem consultant" />
    <meta property="og:locale" content="en_US" />

    <!-- Organization JSON-LD (sitewide) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Shore Strategy",
      "url": "https://shore-strategy.com",
      "logo": "https://shore-strategy.com/favicon.png",
      "description": "Partner ecosystem strategy and fractional partnerships leadership for B2B technology companies.",
      "founder": {
        "@type": "Person",
        "name": "Jonathan Shore"
      },
      "sameAs": [
        "https://www.linkedin.com/in/jonathan-shore/"
      ]
    }
    </script>

    <!-- Person JSON-LD (sitewide) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Jonathan Shore",
      "jobTitle": "Partner Ecosystem Strategist",
      "url": "https://shore-strategy.com",
      "image": "https://shore-strategy.com/author-jonathan.jpeg",
      "sameAs": [
        "https://www.linkedin.com/in/jonathan-shore/"
      ],
      "knowsAbout": [
        "Partner Ecosystem Strategy",
        "Channel Partner Programs",
        "Go-To-Market Strategy",
        "Strategic Alliances",
        "Co-Sell Motion",
        "ISV Partnerships",
        "Revenue Acceleration"
      ],
      "worksFor": {
        "@type": "Organization",
        "name": "Shore Strategy"
      }
    }
    </script>

    <!-- WebSite JSON-LD (sitewide) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Shore Strategy",
      "url": "https://shore-strategy.com",
      "publisher": { "@type": "Organization", "name": "Shore Strategy" }
    }
    </script>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
