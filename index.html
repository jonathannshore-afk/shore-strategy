<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Calendly: warm up DNS/TLS so the Contact page widget loads faster -->
    <link rel="dns-prefetch" href="https://assets.calendly.com" />
    <link rel="dns-prefetch" href="https://calendly.com" />
    <link rel="preconnect" href="https://assets.calendly.com" crossorigin />
    <link rel="preconnect" href="https://calendly.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap"
      />
    </noscript>
    <meta name="author" content="Jonathan Shore" />
    <meta name="google-site-verification" content="8HlaLqtomWG2imzEU-OvRlxJTEWqLZOrZC_PMq6NzxE" />

    <!-- Static SEO defaults (per-route Helmet overrides for JS-executing crawlers;
         these remain the fallback for LinkedIn/Slack/Facebook social previews).
         Do NOT add <link rel="canonical"> here — react-helmet-async owns canonicals
         per route and a static one would duplicate. -->
    <title>Jonathan Shore — Partner Ecosystem Strategist | Shore Strategy</title>
    <meta name="description" content="Fractional partner ecosystem strategist for B2B tech. Jonathan Shore helps SaaS and enterprise tech leaders build, fix, and scale partner ecosystems that drive measurable revenue. 15+ years at Salesforce, ServiceNow, and Lumen." />
    <meta name="keywords" content="partner ecosystem strategy, fractional partnerships leader, channel partner strategy, partner program consultant, go-to-market consultant, B2B SaaS partnerships, partner ecosystem consultant" />

    <!-- Open Graph -->
    <meta property="og:title" content="Jonathan Shore — Partner Ecosystem Strategist" />
    <meta property="og:description" content="Fractional partner ecosystem strategist helping B2B tech companies turn partnerships into a measurable revenue engine." />
    <meta property="og:url" content="https://shore-strategy.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shore Strategy" />
    <meta property="og:image" content="https://shore-strategy.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jonathan Shore — Partner Ecosystem Strategist" />
    <meta name="twitter:description" content="Fractional partner ecosystem strategist helping B2B tech companies turn partnerships into a measurable revenue engine." />
    <meta name="twitter:image" content="https://shore-strategy.com/og-image.jpg" />

    <!-- Organization JSON-LD (sitewide) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Shore Strategy",
      "url": "https://shore-strategy.com",
      "logo": "https://shore-strategy.com/favicon.png",
      "description": "Partner ecosystem strategy and fractional partnerships leadership for B2B technology companies.",
      "founder": {
        "@type": "Person",
        "name": "Jonathan Shore"
      },
      "sameAs": [
        "https://www.linkedin.com/in/jonathan-shore/"
      ]
    }
    </script>

    <!-- Person JSON-LD (sitewide) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Jonathan Shore",
      "jobTitle": "Partner Ecosystem Strategist",
      "url": "https://shore-strategy.com",
      "image": "https://shore-strategy.com/author-jonathan.jpeg",
      "sameAs": [
        "https://www.linkedin.com/in/jonathan-shore/"
      ],
      "knowsAbout": [
        "Partner Ecosystem Strategy",
        "Channel Partner Programs",
        "Go-To-Market Strategy",
        "Strategic Alliances",
        "Co-Sell Motion",
        "ISV Partnerships",
        "Revenue Acceleration"
      ],
      "worksFor": {
        "@type": "Organization",
        "name": "Shore Strategy"
      }
    }
    </script>

    <!-- WebSite JSON-LD (sitewide) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "name": "Shore Strategy",
      "url": "https://shore-strategy.com",

    }
    </script>
</head>
